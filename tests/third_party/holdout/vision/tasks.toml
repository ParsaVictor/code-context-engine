[[task]]
id = "vision_resnet_make_layer"
repo = "vision"
prompt = "How does ResNet._make_layer stack BasicBlock or Bottleneck blocks with a downsample shortcut, and how does _forward_impl run the stages?"
needs = ["torchvision/models/resnet.py::_make_layer", "torchvision/models/resnet.py::_forward_impl"]
forbidden = ["torchvision/models/densenet.py"]

[[task]]
id = "vision_model_registry"
