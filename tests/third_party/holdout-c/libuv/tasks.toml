[[task]]
id = "uv_timer_start_and_run"
repo = "libuv"
prompt = "How does uv_timer_start register a timer in the loop's heap, and how does uv__run_timers fire the expired ones?"
needs = ["src/timer.c::uv_timer_start", "src/timer.c::uv__run_timers"]
forbidden = ["src/unix/tty.c"]

[[task]]
id = "uv_run_loop_unix"
repo = "libuv"
prompt = "On Unix, how does uv_run iterate the event loop: uv__loop_alive, pending/idle/prepare phases, uv__io_poll with uv__backend_timeout, then check and closing handles?"
needs = ["src/unix/core.c::uv_run", "src/unix/core.c::uv__loop_alive", "src/unix/core.c::uv__backend_timeout"]
forbidden = ["src/win/core.c"]

[[task]]
id = "uv_async_send_wakeup"
repo = "libuv"
prompt = "On Unix, how does uv_async_send use the pending and busy atomics to wake the loop through uv__async_send exactly once?"
needs = ["src/unix/async.c::uv_async_send"]
forbidden = ["src/unix/signal.c"]

[[task]]
id = "uv_threadpool_queue_work"
repo = "libuv"
prompt = "How does uv_queue_work hand a request to the thread pool through uv__work_submit, and how does the worker function pick work off the queue?"
needs = ["src/threadpool.c::uv_queue_work", "src/threadpool.c::uv__work_submit", "src/threadpool.c::worker"]
forbidden = ["src/unix/random-devurandom.c"]

[[task]]
id = "uv_listen_tcp_unix"
repo = "libuv"
prompt = "On Unix, how does uv_listen dispatch a TCP stream to uv__tcp_listen, and how does uv__tcp_listen start the io watcher with uv__server_io?"
needs = ["src/unix/stream.c::uv_listen", "src/unix/tcp.c::uv__tcp_listen"]
forbidden = ["src/unix/poll.c"]

[[task]]
id = "uv_signal_start_register"
repo = "libuv"
prompt = "On Unix, how does uv_signal_start go through uv__signal_start to register a handler with uv__signal_register_handler when no watcher exists for that signum yet?"
needs = ["src/unix/signal.c::uv_signal_start", "src/unix/signal.c::uv__signal_start"]
forbidden = ["src/unix/process.c"]

[[task]]
id = "uv_getaddrinfo_request"
repo = "libuv"
prompt = "On Unix, how does uv_getaddrinfo validate its arguments, convert the hostname with uv__idna_toascii, and pack hostname, service and hints into one buffer?"
needs = ["src/unix/getaddrinfo.c::uv_getaddrinfo"]
forbidden = ["src/unix/getnameinfo.c"]

[[task]]
id = "uv_loop_init_unix"
repo = "libuv"
prompt = "On Unix, how does uv_loop_init allocate the internal fields, initialise the timer heap and handle queues, and what does it undo on failure?"
needs = ["src/unix/loop.c::uv_loop_init"]
forbidden = ["src/unix/loop-watcher.c"]
