[[task]]
id = "oslib_write_outputstream"
repo = "oslib"
prompt = "How does os.write.outputStream create parent folders and apply permissions before opening the file, and how does write.write perform the actual write?"
needs = ["os/src/ReadWriteOps.scala::outputStream", "os/src/ReadWriteOps.scala::write"]
forbidden = ["os/src/ZipOps.scala"]

[[task]]
id = "oslib_walk_stream"
