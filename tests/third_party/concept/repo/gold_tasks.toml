# Concept questions about this repository: plain-language, no identifier in
# the prompt. Gold written by reading the code, locked before any packet was
# looked at (2026-09-30). The first four are the upstream author's battery
# (root_fs_safety, reinforcement, max_files_cap, retry); retry's gold is the
# provider files because this fork does implement retry/backoff.

[[task]]
id = "concept_root_fs_safety"
prompt = "How does this tool prevent indexing dangerous paths like the filesystem root?"
gold_files = ["crates/neuromesh-index/src/confine.rs"]
forbidden_files = []
expect_seeds_missed = false

