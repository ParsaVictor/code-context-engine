[[task]]
id = "kerasio_captcha_ocr_ctc"
repo = "kerasio"
prompt = "In the captcha OCR example, how does CTCLayer compute ctc_batch_cost in call, and how does build_model wire it into the model that is trained with model.fit?"
needs = ["examples/vision/captcha_ocr.py::CTCLayer", "examples/vision/captcha_ocr.py::build_model", "examples/vision/captcha_ocr.py::ctc_batch_cost"]
forbidden = ["examples/vision/handwriting_recognition.py"]

