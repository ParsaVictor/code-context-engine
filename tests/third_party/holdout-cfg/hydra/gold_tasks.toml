# lightning-hydra-template @ bddbc24b — Config→Code questions.
# Gold = the YAML that defines the key + the Python that reads it.

[[task]]
id = "hydra_optimizer_lr"
prompt = "Where is the optimizer lr and weight_decay from configs/model/mnist.yaml consumed when configure_optimizers builds the optimizer from self.hparams?"
gold_files = ["configs/model/mnist.yaml", "src/models/mnist_module.py"]
forbidden_files = ["src/utils/rich_utils.py"]
expect_seeds_missed = false

