# Task cases on the fixture repositories: what a model would need to *finish*
# each task, at symbol level. `needs` are `file::symbol` (bare file = the
# file is enough). Scored by `neuromesh eval --tasks` (oracle) and gated by
# `crates/neuromesh-context/tests/task_success.rs`.

[[task]]
